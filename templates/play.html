{% extends "base.html" %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for("static", filename="css/play.css")}}">
    <title>Local Spotify Quiz</title>
{% endblock %}
{% block body %}
    <div class="container-fluid nav-bar">
        <div class="row d-flex align-items-center">
            <div class="col">
                <h1 id="page-title">Local Spotify Quiz</h1>
            </div>
            <div class="col">
                <button id="back-home-button" onclick="window.location.href=`{{ url_for('quiz') }}`">
                    < Back to playlists
                </button>
            </div>
        </div>
    </div>

    <div class="container-fluid info-panel">
        <div class="row d-flex align-items-center">
            <div class="col-md-6 text-center">
                <div class="row">
                    <div class="col text-start">
                        <span id="info-text">{{ songs|length }}/{{ songs_total }} songs could be loaded</span>
                    </div>
                    <div class="col text-end px-5">
                        <span id="round-counter">Round 1/10</span>  <!-- Change round count to dynamically -->
                    </div>
                </div>
            </div>
            <div class="col-md-6 d-flex align-items-center gap-2 text-start px-5">
                <i class="bi bi-volume-up"></i>
                <input type="range" id="volume" min="0" max="100" value="60">
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div 
                class="side col-md-6 d-flex flex-column justify-content-center text-center"
                id="answer-side"
            >
                <button class="primary-button mb-3" id="submit-answer">Submit</button>
                <input type="text" class="answer-input" id="user-answer" placeholder="Enter your answer">
                <p id="answer-helper"></p>
            </div>
            <div 
                class="side col-md-6 d-flex flex-column align-items-center justify-content-center text-center" 
                id="song-side"
            >
                <p id="timer"></p>
                <div id="play-div">
                    <button type="button" id="play-button" aria-label="Play song">
                        <img src="{{ url_for('static', filename='images/play-button.png') }}" alt="Play song">
                    </button>
                    <i>Click to play</i>
                </div>

                <div id="results"></div>
                <button class="primary-button" id="next-round-button">Next Round</button>
                <button 
                    class="primary-button" 
                    id="back-home-final-results-button" 
                    onclick="window.location.href=`{{ url_for('quiz') }}`"
                >
                    Back to playlists
                </button>
            </div>
        </div>
    </div>


    <script>
        window.token = "{{ session.get('access_token') }}";
        window.songs = {{ songs | tojson }}; 
    </script>
    <script type="module" src="{{ url_for('static', filename='js/quiz.js') }}"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
{% endblock %}
